<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found - Antoni Gruba</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2a5c45" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Absolute paths, as GitHub Pages serves this page for missing URLs at any depth -->
  <link rel="stylesheet" href="/style.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex; align-items: center;
      text-align: center;
    }
    .not-found .hero-sub { margin-left: auto; margin-right: auto; }
    .not-found .hero-btns { justify-content: center; }
  </style>
</head>
<body>

  <section class="not-found">
    <div class="container">
      <div class="hero-tag">404 · Page not found</div>
      <h1 class="hero-title">Nothing <em>here</em></h1>
      <p class="hero-sub">This page doesn't exist or has moved. Try one of these instead.</p>
      <div class="hero-btns">
        <a href="/" class="btn btn-primary">Home</a>
        <a href="/#projects" class="btn btn-secondary">Projects</a>
        <a href="/chalkboard/" class="btn btn-secondary">Chalkboard</a>
        <a href="/echoes/" class="btn btn-secondary">Echoes</a>
      </div>
    </div>
  </section>

</body>
</html>
